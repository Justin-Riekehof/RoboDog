; PlatformIO project for the wavego-robodog sketch.
; Open this folder in VS Code (PlatformIO extension), or from the repo root:
;   pio run   -d firmware/wavego-robodog          build
;   pio run   -d firmware/wavego-robodog -t upload   build and flash
;   pio device monitor -b 115200
;
; The settings live one level up in ../common.ini, shared with the other
; sketch on purpose -- see the note at the top of that file.

[platformio]
src_dir = .
extra_configs = ../common.ini

[env:wavego]
extends = common

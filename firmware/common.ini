; Shared build settings for both sketches.
;
; Both the baseline and the fork MUST build with identical settings -- otherwise
; "the fork behaves like the baseline" compares two different builds and means
; nothing. That is why this file exists instead of two copies: the settings
; cannot drift apart without someone noticing.
;
; Every value here is either read off the source or marked as unverified.

[common]
; Arduino core 1.0.6. NOT a preference: app_httpd.cpp includes
; <dl_lib_matrix3d.h>, which belongs to the old ESP32 camera driver and was
; removed in core 2.x/3.x. A current platform version fails to compile with an
; error about that header, which reads like a broken sketch and is not one.
platform = espressif32@3.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; Versions are pinned because this is 2022 code and its libraries have since
; renamed things out from under it. Unpinned, PlatformIO fetches the latest and
; the build fails with errors that read like a broken sketch and are not.
;
;   ArduinoJson  v7 dropped `StaticJsonDocument` (WAVEGO.ino:65) -> pin v6.
;   INA219_WE    1.4.0 prefixed every enum, PG_320 -> INA219_PG_320 and
;                BRNG_16 -> INA219_BRNG_16 (InitConfig.h:103-104), so 1.3.8 is
;                the last version this sketch compiles against.
;   ICM20948_WE  1.2.2 changed the getters from `xyzFloat getAccRawValues()` to
;                an out-parameter form (InitConfig.h:74-76), so 1.2.1 is the
;                last one that matches.
;
; Comments must stay OUT of the lib_deps block itself: a `;` line inside a
; multi-line value is parsed as part of the value, and the entries after it
; silently disappear.
lib_deps =
    bblanchon/ArduinoJson@^6.21.0
    adafruit/Adafruit NeoPixel
    adafruit/Adafruit PWM Servo Driver Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    wollewald/ICM20948_WE@1.2.1
    wollewald/INA219_WE@~1.3.8

; Partition table: the DEFAULT one, i.e. no board_build.partitions line.
; Measured 2026-08-22: the binary is 849,648 bytes and the default app0 slot
; holds 1,310,720 -- 27% of a huge_app table, 65% of the default one. Staying on
; the default keeps the flash layout the same as the factory firmware's, which
; is what a baseline is for. Both tables put nvs at 0x9000/0x5000 either way, so
; the servo middles stored there survive a flash with either.

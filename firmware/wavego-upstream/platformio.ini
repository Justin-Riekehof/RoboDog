; PlatformIO project for the wavego-upstream sketch.
; Open this folder in VS Code (PlatformIO extension), or from the repo root:
;   pio run   -d firmware/wavego-upstream          build
;   pio run   -d firmware/wavego-upstream -t upload   build and flash
;   pio device monitor -b 115200
;
; The settings live one level up in ../common.ini, shared with the other
; sketch on purpose -- see the note at the top of that file.
;
; Keep this file free of build settings. `pio pkg install --library ...` writes
; the dependency in here and inlines the shared section with it, which silently
; forks the two builds; a test in tests/test_firmware_fork.py guards against it.

[platformio]
src_dir = .
extra_configs = ../common.ini

[env:wavego]
extends = common

[project]
name = "robodog"
version = "0.1.0"
description = "Software platform for the Waveshare WAVEGO quadruped: one robot API, swappable mock/sim/hardware backends, teach-in routines, gamepad teleop, digital twin."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Justin Riekehof" }]
keywords = ["robotics", "quadruped", "wavego", "waveshare", "kinematics", "mujoco", "esp32"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Justin-Riekehof/RoboDog"
Repository = "https://github.com/Justin-Riekehof/RoboDog"
Issues = "https://github.com/Justin-Riekehof/RoboDog/issues"

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
sim = ["mujoco>=3.2"]
# M8. Heavy -- it pulls torch -- and imported only from robodog.vision.yolo,
# which nothing reaches unless a YOLO detector is actually asked for. Nothing
# in the vision path needs it to be tested: a scripted detector stands in, so
# the suite is green on an install that never fetched torch.
# torch and torchvision are named here although ultralytics already requires
# them: `tool.uv.sources` below only redirects a project's own dependencies, so
# a transitive torch would come from PyPI as the CUDA build regardless.
vision = ["ultralytics>=8.3", "torch>=2.2", "torchvision>=0.17"]

# torch comes from the CPU wheel index, and that is a deliberate default rather
# than a limitation. The default (CUDA) build of torch pulls sixteen `nvidia-*`
# packages and lands at 5-6 GB; the CPU one is about 200 MB. What that buys here
# is nothing worth having: the detector runs against an ESP32 camera delivering
# ten-odd frames a second over Wi-Fi, and `yolo11n` on a CPU is 20-50 ms a
# frame -- faster than the pictures arrive. On the machine this was set up on
# the GPUs are also serving a language model with about 3.6 GB of headroom
# each, so keeping the detector off them is the better arrangement anyway.
#
# CI never installs the `vision` extra, so none of this reaches it. To go back
# to CUDA, delete the two blocks below and re-lock -- `--yolo-device` already
# lets a run choose where it executes.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[project.scripts]
robodog = "robodog.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    # Talking to the ESP32 over USB. Officially the serial transport is M7
    # outlook, but in practice it is the channel that works while the laptop
    # keeps its internet -- flashing, the camera `snap`, and every firmware
    # diagnostic go through it.
    "pyserial>=3.5",
    "types-pyserial>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robodog"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # import sorting
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/robodog", "tests"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "mujoco.*", "ultralytics.*", "PIL.*"]
ignore_missing_imports = true

# ultralytics re-exports YOLO from its package __init__ without the explicit
# `as` form that strict mode demands. Only reachable with the `vision` extra
# installed -- CI does not install it, so there mypy sees a missing module and
# the rule above applies instead. Which is worth knowing: **type errors inside
# robodog/vision/yolo.py are invisible to CI**, because the module it talks to
# is not there. Run mypy locally with the extra after touching that file.
[[tool.mypy.overrides]]
module = ["ultralytics"]
implicit_reexport = true

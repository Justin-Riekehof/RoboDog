name: CI

# Every branch, not just main: the point of CI here is that several agents can
# work this repo at once, each on its own branch, and each find out within a
# couple of minutes whether it broke something the others depend on. A check
# that only runs after a merge tells you that too late.
on:
  push:
  pull_request:
  workflow_dispatch:

# A branch that gets three pushes while the first is still building only needs
# the last one checked. Cancelling the rest keeps the queue short when several
# branches are active at the same time -- but never on main, where every commit
# deserves its own verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      # --all-extras matters: matplotlib and mujoco are optional, and two tests
      # assert the twin's geometry. Syncing without them silently skips both.
      - run: uv sync --all-groups --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # No hardware, ever -- the suite passes with no robot attached, which is
      # what makes it safe for an agent to run unattended.
      - run: uv run pytest -q
